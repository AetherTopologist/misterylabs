<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MisterY Labs</title>
  <!--
    GitHub Pages SPA fallback — rafgraph/spa-github-pages technique.
    Encodes the full path into a query string and redirects to the
    SPA root so React Router can handle it client-side.
    pathSegmentsToKeep=1 preserves the /misterylabs/ repo prefix.
  -->
  <script>
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
