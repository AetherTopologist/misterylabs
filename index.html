<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Restore rafgraph spa-github-pages paths before the app boots.
         404.html redirects /misterylabs/foo → /misterylabs/?/foo -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          var base = l.pathname.slice(-1) === "/" ? l.pathname.slice(0, -1) : l.pathname;
          window.history.replaceState(null, null, base + decoded + l.hash);
        }
      })(window.location);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MisterY Labs — Home of Curved Transport Research</title>
