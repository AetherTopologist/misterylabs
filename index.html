  <body>
    <div id="root"></div>
    <!-- Decode the path encoded by 404.html before React Router mounts -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, l.pathname.indexOf('/misterylabs') + '/misterylabs'.length) +
            '/' + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
